<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI EXECUTIVE COMMANDER - VISION & VOX</title>
  <style>
    :root { --bg: #020617; --panel: #0f172a; --accent: #38bdf8; --red: #ef4444; }
    body { margin: 0; background: var(--bg); color: #f1f5f9; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 8px 20px; background: var(--panel); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; color: var(--accent); letter-spacing: 1.5px; font-size: 1rem; }

    main { flex: 1; display: flex; overflow: hidden; }
    #chatContainer { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }
    #chatDisplay { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.6; font-size: 0.95rem; }
    .msg-user { align-self: flex-end; background: #0ea5e9; color: #000; font-weight: bold; }
    .msg-ai { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }

    #visionContainer { width: 300px; background: #000; padding: 10px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #334155; }
    .stream-box { position: relative; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid #475569; background: #000; }
    video, img { width: 100%; display: block; }
    .vid-label { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); font-size: 0.6rem; padding: 2px 5px; border-radius: 3px; color: var(--accent); }

    .controls { padding: 15px 25px; background: var(--panel); display: flex; gap: 15px; border-top: 1px solid #334155; align-items: center; justify-content: center; }
    .btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: #334155; color: white; cursor: pointer; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .btn-active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
    .listening { background: var(--red); animation: pulse 1s infinite; color: white; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    #textInput { flex: 1; background: #020617; border: 1px solid #475569; color: white; padding: 12px 20px; border-radius: 35px; }
    .auto-mode { color: #10b981; font-weight: bold; font-size: 0.75rem; border: 1px solid #10b981; padding: 2px 8px; border-radius: 10px; }
  </style>
</head>
<body>

<header>
  <div class="logo">AI COMMANDER <span id="autoBadge" class="auto-mode" style="display:none;">AUTO-VOX ON</span></div>
  <div style="font-size: 0.7rem; color: #475569;">🔑 KEY: AIzaSyD1... (Connected)</div>
</header>

<main>
  <div id="chatContainer">
    <div id="chatDisplay">
      <div class="msg msg-ai">GitHub Pages 準備完了。<br>1. 📷か🖥️で映像を出す<br>2. 🎤を押し「自動モード」へ<br>あとは自由に話しかけてください。</div>
    </div>
    <div class="controls">
      <button id="camBtn" class="btn" title="カメラ起動">📷</button>
      <button id="screenBtn" class="btn" title="画面共有">🖥️</button>
      <input type="text" id="textInput" placeholder="話しかけてください...">
      <button id="micBtn" class="btn" title="連続対話">🎤</button>
    </div>
  </div>

  <div id="visionContainer">
    <div class="stream-box">
      <span class="vid-label" id="streamType">NO SIGNAL</span>
      <video id="mainVideo" autoplay playsinline muted></video>
    </div>
    <div class="stream-box">
      <span class="vid-label">LAST ANALYSIS</span>
      <img id="lastFrame">
    </div>
    <canvas id="capCanvas" style="display:none;"></canvas>
  </div>
</main>

<script>
  // --- 初期設定 ---
  const API_KEY = "AIzaSyD1S3rlQh_OlhFB160OLvGOKGIsq2XJ5aE";
  const SYSTEM_INSTRUCTION = "あなたは物販プロ「AI社長」と「JARVIS」です。画像と会話から利益を判断し、日本語で短く声で聞き取りやすく即答せよ。";

  let chatHistory = [];
  let activeStream = null;
  let isAutoMode = false;

  const chatDisplay = document.getElementById('chatDisplay');
  const textInput = document.getElementById('textInput');
  const micBtn = document.getElementById('micBtn');
  const mainVideo = document.getElementById('mainVideo');
  const streamType = document.getElementById('streamType');
  const lastFrame = document.getElementById('lastFrame');

  // --- 音声認識 ---
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;

  recognition.onstart = () => micBtn.classList.add('listening');
  recognition.onend = () => {
    micBtn.classList.remove('listening');
    if(isAutoMode && !window.speechSynthesis.speaking) {
      setTimeout(() => { try { recognition.start(); } catch(e){} }, 400);
    }
  };
  recognition.onresult = (e) => {
    textInput.value = e.results[0][0].transcript;
    processAction();
  };

  micBtn.onclick = () => {
    isAutoMode = !isAutoMode;
    document.getElementById('autoBadge').style.display = isAutoMode ? 'inline' : 'none';
    if(isAutoMode) { try { recognition.start(); } catch(e){} }
    else { recognition.stop(); window.speechSynthesis.cancel(); }
  };

  // --- 読み上げ ---
  function speak(text) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[*#]/g, '').replace(/【.*?】/g, '');
    const uttr = new SpeechSynthesisUtterance(cleanText);
    uttr.lang = 'ja-JP';
    uttr.rate = 1.2;
    uttr.onend = () => {
      if(isAutoMode) setTimeout(() => { try { recognition.start(); } catch(e){} }, 400);
    };
    window.speechSynthesis.speak(uttr);
  }

  // --- カメラ起動 ---
  document.getElementById('camBtn').onclick = async () => {
    stopStream();
    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      mainVideo.srcObject = activeStream;
      streamType.innerText = "CAMERA";
      document.getElementById('camBtn').classList.add('btn-active');
    } catch (e) { alert("カメラを許可してください"); }
  };

  // --- 画面共有 ---
  document.getElementById('screenBtn').onclick = async () => {
    stopStream();
    try {
      activeStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      mainVideo.srcObject = activeStream;
      streamType.innerText = "SCREEN";
      document.getElementById('screenBtn').classList.add('btn-active');
    } catch (e) { alert("画面共有を許可してください"); }
  };

  function stopStream() {
    if(activeStream) activeStream.getTracks().forEach(t => t.stop());
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('btn-active'));
  }

  // --- 解析実行 ---
  async function processAction() {
    const prompt = textInput.value.trim();
    let base64Img = null;
    
    if (activeStream && mainVideo.videoWidth > 0) {
      const canvas = document.getElementById('capCanvas');
      canvas.width = mainVideo.videoWidth; canvas.height = mainVideo.videoHeight;
      canvas.getContext('2d').drawImage(mainVideo, 0, 0);
      base64Img = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      lastFrame.src = canvas.toDataURL('image/jpeg');
    }

    if(!prompt && !base64Img) return;
    addMessage('user', prompt || "画像を解析中...");
    textInput.value = "";

    try {
      const currentMsg = { role: "user", parts: [{ text: prompt || "映像を解析して物販アドバイスをください。" }] };
      if (base64Img) currentMsg.parts.push({ inlineData: { mimeType: "image/jpeg", data: base64Img } });
      chatHistory.push(currentMsg);

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          contents: chatHistory.slice(-8),
          systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
        })
      });

      const data = await response.json();
      const aiText = data.candidates[0].content.parts[0].text;
      addMessage('ai', aiText);
      chatHistory.push({ role: "model", parts: [{ text: aiText }] });
      speak(aiText);

    } catch (e) {
      addMessage('ai', "解析エラー。通信か設定を確認してください。");
      if(isAutoMode) setTimeout(() => { try { recognition.start(); } catch(e){} }, 3000);
    }
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg msg-${role}`;
    div.innerText = text;
    chatDisplay.appendChild(div);
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
  }
</script>
</body>
</html>

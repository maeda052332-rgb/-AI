<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI EXECUTIVE COMMANDER</title>
  <style>
    :root { --bg: #020617; --panel: #0f172a; --accent: #38bdf8; --red: #ef4444; }
    body { margin: 0; background: var(--bg); color: #f1f5f9; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; color: var(--accent); letter-spacing: 1px; font-size: 0.95rem; }
    
    main { flex: 1; display: flex; overflow: hidden; }
    #chatContainer { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.4); position: relative; }
    #chatDisplay { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; }
    .msg-user { align-self: flex-end; background: #0ea5e9; color: #000; font-weight: bold; }
    .msg-ai { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .msg-system { align-self: center; background: #334155; color: #cbd5e1; font-size: 0.75rem; padding: 6px 12px; border-radius: 6px; text-align: center; }
    .msg-error { align-self: center; background: #450a0a; color: #f87171; border: 1px solid #f87171; font-size: 0.8rem; width: 95%; padding: 12px; border-radius: 8px; white-space: pre-wrap; }

    #visionContainer { width: 300px; background: #000; padding: 10px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #334155; }
    video, img { width: 100%; border-radius: 6px; border: 1px solid #475569; background: #000; }
    .vid-title { font-size: 0.65rem; color: #94a3b8; }

    #inputForm { padding: 12px 16px; background: var(--panel); border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    .btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #334155; color: white; cursor: pointer; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-active { background: var(--accent); color: #000; }
    .listening { background: var(--red); animation: pulse 1s infinite; color: white; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    #textInput { flex: 1; background: #020617; border: 1px solid #475569; color: white; padding: 12px 18px; border-radius: 25px; font-size: 1rem; outline: none; }
    #textInput:focus { border-color: var(--accent); }
    #statusLine { font-size: 0.7rem; color: #94a3b8; text-align: center; padding: 4px; background: #0b1329; display: flex; justify-content: space-around; }
  </style>
</head>
<body>

<header>
  <div class="logo">AI COMMANDER</div>
  <div id="activeModelBadge" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">⚡ 3.8 Flash Ready</div>
</header>

<main>
  <div id="chatContainer">
    <div id="chatDisplay">
      <div class="msg msg-system">接続完了。最新3.8 Flashを優先し、混雑時は自動迂回して即答します。Enterキーまたはマイクでどうぞ！</div>
    </div>
    <div id="statusLine">
      <span id="micStatus">マイク: 待機中</span>
      <span id="aiStatus">AI: スタンバイ</span>
    </div>
    
    <form id="inputForm" onsubmit="handleFormSubmit(event)">
      <button type="button" id="camBtn" class="btn" title="カメラ起動">📷</button>
      <button type="button" id="screenBtn" class="btn" title="画面共有">🖥️</button>
      <input type="text" id="textInput" placeholder="文字入力してEnter、またはマイクで指示..." autocomplete="off">
      <button type="button" id="micBtn" class="btn" title="音声入力">🎤</button>
      <button type="submit" id="sendBtn" class="btn" style="background:var(--accent); color:#000;">➤</button>
    </form>
  </div>

  <div id="visionContainer">
    <div class="vid-title">映像プレビュー</div>
    <video id="mainVideo" autoplay playsinline muted></video>
    <div class="vid-title">直前の解析フレーム</div>
    <img id="lastFrame">
    <canvas id="capCanvas" style="display:none;"></canvas>
  </div>
</main>

<script>
  const API_KEY = "AQ.Ab8RN6K3g4_EtTfZLeAvQcYgEtEIH4L83ugV9GfqWg6XXKHdhQ";
  
  // 優先順位：最新の3.8を第1希望にし、混雑時は3.7 / 3.5に自動迂回
  const MODEL_CANDIDATES = [
    "gemini-3.8-flash",
    "gemini-3.7-flash",
    "gemini-3.5-flash",
    "gemini-2.5-flash"
  ];

  let chatHistory = [];
  let activeStream = null;
  let isAuto = false;

  const chatDisplay = document.getElementById('chatDisplay');
  const textInput = document.getElementById('textInput');
  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const aiStatus = document.getElementById('aiStatus');
  const activeModelBadge = document.getElementById('activeModelBadge');
  const mainVideo = document.getElementById('mainVideo');

  // --- Enterキー・送信処理 ---
  function handleFormSubmit(e) {
    if (e) e.preventDefault();
    processAction();
  }

  // --- 音声認識 ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onstart = () => {
      micBtn.classList.add('listening');
      micStatus.innerText = "マイク: 🔴 音声入力中...";
      micStatus.style.color = "#f87171";
    };

    recognition.onend = () => {
      micBtn.classList.remove('listening');
      micStatus.innerText = "マイク: 待機中";
      micStatus.style.color = "#94a3b8";
      if (isAuto && !window.speechSynthesis.speaking) {
        setTimeout(() => { try { recognition.start(); } catch(e){} }, 400);
      }
    };

    recognition.onerror = (event) => {
      micStatus.innerText = "マイクエラー: " + event.error;
    };

    recognition.onresult = (e) => {
      const text = e.results[0][0].transcript;
      textInput.value = text;
      processAction();
    };
  } else {
    micStatus.innerText = "マイク: 非対応ブラウザ";
  }

  micBtn.onclick = () => {
    if (!recognition) return alert("Google Chromeをご使用ください");
    isAuto = !isAuto;
    if (isAuto) {
      try { recognition.start(); } catch(e){}
    } else {
      recognition.stop();
      window.speechSynthesis.cancel();
    }
  };

  // --- 音声読み上げ ---
  function speak(text) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[*#]/g, '').replace(/【.*?】/g, '');
    const uttr = new SpeechSynthesisUtterance(cleanText);
    uttr.lang = 'ja-JP';
    uttr.rate = 1.2;
    uttr.onend = () => {
      if (isAuto) setTimeout(() => { try { recognition.start(); } catch(e){} }, 400);
    };
    window.speechSynthesis.speak(uttr);
  }

  // --- カメラ・画面共有 ---
  document.getElementById('camBtn').onclick = async () => {
    stopStream();
    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      mainVideo.srcObject = activeStream;
      document.getElementById('camBtn').classList.add('btn-active');
    } catch (e) { alert("カメラ許可エラー: " + e.message); }
  };

  document.getElementById('screenBtn').onclick = async () => {
    stopStream();
    try {
      activeStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      mainVideo.srcObject = activeStream;
      document.getElementById('screenBtn').classList.add('btn-active');
    } catch (e) { alert("画面共有エラー: " + e.message); }
  };

  function stopStream() {
    if (activeStream) activeStream.getTracks().forEach(t => t.stop());
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('btn-active'));
  }

  // --- メイン解析処理（混雑時自動フォールバック機能付き） ---
  async function processAction() {
    const prompt = textInput.value.trim();
    let base64Img = null;

    if (activeStream && mainVideo.videoWidth > 0) {
      const canvas = document.getElementById('capCanvas');
      canvas.width = mainVideo.videoWidth; canvas.height = mainVideo.videoHeight;
      canvas.getContext('2d').drawImage(mainVideo, 0, 0);
      base64Img = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      document.getElementById('lastFrame').src = canvas.toDataURL('image/jpeg');
    }

    if (!prompt && !base64Img) return;
    addMessage('user', prompt || "画像を解析中...");
    textInput.value = "";
    aiStatus.innerText = "AI: 思考中...";

    const payload = {
      contents: chatHistory.concat([{
        role: "user",
        parts: [
          { text: prompt || "画像の内容を物販のプロとして詳しく解析して日本語で短く答えてください。" },
          ...(base64Img ? [{ inlineData: { mimeType: "image/jpeg", data: base64Img } }] : [])
        ]
      }]).slice(-6),
      systemInstruction: { parts: [{ text: "あなたは物販プロ。日本語で短く声で聞き取りやすく即答せよ。" }] }
    };

    let responseData = null;
    let usedModel = null;
    let lastErrMsg = "";

    // 候補モデルを順に試し、混雑（high demand）していれば即座に次へ切り替え
    for (const modelName of MODEL_CANDIDATES) {
      try {
        aiStatus.innerText = `AI: ${modelName} 呼出中...`;
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`;

        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': API_KEY
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        // 混雑エラー（high demand）や過負荷の場合は次のモデルへ自動フォールバック
        if (data.error) {
          lastErrMsg = data.error.message;
          console.warn(`${modelName} 混雑のため待機:`, data.error.message);
          continue;
        }

        if (data.candidates && data.candidates[0].content) {
          responseData = data;
          usedModel = modelName;
          break; // 成功！
        }
      } catch (err) {
        lastErrMsg = err.message;
        console.warn(`${modelName} 通信エラー:`, err);
      }
    }

    if (responseData && responseData.candidates[0].content.parts[0].text) {
      const aiText = responseData.candidates[0].content.parts[0].text;
      activeModelBadge.innerText = `⚡ ${usedModel} 応答`;
      aiStatus.innerText = "AI: 回答完了";
      addMessage('ai', aiText);
      chatHistory.push({ role: "user", parts: [{ text: prompt || "解析依頼" }] });
      chatHistory.push({ role: "model", parts: [{ text: aiText }] });
      speak(aiText);
    } else {
      aiStatus.innerText = "AI: 全モデル混雑中";
      addMessage('error', "【一時的な過負荷】Googleの全サーバーが混雑しています。数十秒後に再度お試しください。\n詳細: " + lastErrMsg);
      if (isAuto) setTimeout(() => { try { recognition.start(); } catch(e){} }, 4000);
    }
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg msg-${role}`;
    div.innerText = text;
    chatDisplay.appendChild(div);
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
  }
</script>
</body>
</html>
